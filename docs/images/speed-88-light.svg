<text x="337.36890835263534" y="294" font-size="15" fill="#0b0b0b" font-weight="500">105<tspan font-weight="400" fill="#76756f" font-size="13" dx="8">reference</tspan></text>
<text x="32" y="378" font-size="12" fill="#76756f">3 pairs of '88-style hill warriors × 4,000 rounds, 446M instructions. Whole process wall time, median of 7, one thread.</text>
<text x="32" y="396" font-size="12" fill="#76756f">pMARS -O2, exMARS -O3 -fomit-frame-pointer, fmars -O3 -march=native, rmars --release, 42mars -O3.</text>
<text x="32" y="414" font-size="12" fill="#76756f">Ryzen 9 7950X, GCC 16.2, Node 22.22, 14th November 2026. Commands: docs/images/speed.mjs.</text>
