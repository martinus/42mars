<svg xmlns="http://www.w3.org/2000/svg" width="880" height="448" viewBox="0 0 880 448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">42mars: speed of Core War simulators, native code, '88-style warriors</title>
<desc id="desc">Million simulated instructions per second, one thread, the same 12,000 rounds for every engine: 42mars C 527, fmars C 398, exMARS 0.01 C 278, rmars Rust 193, pMARS 0.9.5 C 105.</desc>
<rect x="0.5" y="0.5" width="879" height="447" rx="14" fill="#fcfcfb" stroke="#e6e5e0"/>
<text x="32" y="62" font-size="34" font-weight="700" fill="#0b0b0b">42mars<tspan font-weight="400" fill="#52514e" font-size="21" dx="14">speed of Core War simulators, native code, '88-style warriors</tspan></text>
<text x="32" y="90" font-size="14.5" fill="#52514e">Every engine plays the same 12,000 rounds and gets the same wins, losses and ties.</text>
