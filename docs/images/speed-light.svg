<text x="323" y="286" text-anchor="middle" font-size="12" fill="#76756f">100</text>
<line x1="404" y1="110" x2="404" y2="268" stroke="#d6d5cf" stroke-dasharray="2 3"/>
<text x="404" y="286" text-anchor="middle" font-size="12" fill="#76756f">200</text>
<line x1="485" y1="110" x2="485" y2="268" stroke="#d6d5cf" stroke-dasharray="2 3"/>
<text x="485" y="286" text-anchor="middle" font-size="12" fill="#76756f">300</text>
<line x1="566" y1="110" x2="566" y2="268" stroke="#d6d5cf" stroke-dasharray="2 3"/>
<text x="566" y="286" text-anchor="middle" font-size="12" fill="#76756f">400</text>
<line x1="647" y1="110" x2="647" y2="268" stroke="#d6d5cf" stroke-dasharray="2 3"/>
<text x="647" y="286" text-anchor="middle" font-size="12" fill="#76756f">500</text>
<line x1="728" y1="110" x2="728" y2="268" stroke="#d6d5cf" stroke-dasharray="2 3"/>
<text x="728" y="286" text-anchor="middle" font-size="12" fill="#76756f">600</text>
<text x="485" y="306" text-anchor="middle" font-size="13" fill="#52514e">million simulated instructions per second</text>
<text x="228" y="134" text-anchor="end" font-size="15" fill="#0b0b0b" font-weight="700">42mars<tspan font-weight="400" fill="#76756f" font-size="13" dx="7">C</tspan></text>
<path d="M242,118h323.92317609724614a4,4 0 0 1 4,4v14a4,4 0 0 1 -4,4h-323.92317609724614z" fill="#f0652d"/>
<text x="579.9231760972461" y="134" font-size="15" fill="#0b0b0b" font-weight="700">405<tspan font-weight="400" fill="#76756f" font-size="13" dx="8">4.0× pMARS</tspan></text>
<text x="228" y="174" text-anchor="end" font-size="15" fill="#0b0b0b" font-weight="500">exMARS 0.01<tspan font-weight="400" fill="#76756f" font-size="13" dx="7">C</tspan></text>
<path d="M242,158h192.66928032258065a4,4 0 0 1 4,4v14a4,4 0 0 1 -4,4h-192.66928032258065z" fill="#b5b4ae"/>
<text x="448.6692803225807" y="174" font-size="15" fill="#0b0b0b" font-weight="500">243<tspan font-weight="400" fill="#76756f" font-size="13" dx="8">2.4× pMARS</tspan></text>
<text x="228" y="214" text-anchor="end" font-size="15" fill="#0b0b0b" font-weight="500">rmars<tspan font-weight="400" fill="#76756f" font-size="13" dx="7">Rust</tspan></text>
<path d="M242,198h140.44531107846854a4,4 0 0 1 4,4v14a4,4 0 0 1 -4,4h-140.44531107846854z" fill="#b5b4ae"/>
<text x="396.44531107846854" y="214" font-size="15" fill="#0b0b0b" font-weight="500">178<tspan font-weight="400" fill="#76756f" font-size="13" dx="8">1.7× pMARS</tspan></text>
<text x="228" y="254" text-anchor="end" font-size="15" fill="#0b0b0b" font-weight="500">pMARS 0.9.5<tspan font-weight="400" fill="#76756f" font-size="13" dx="7">C</tspan></text>
<path d="M242,238h78.88128996737356a4,4 0 0 1 4,4v14a4,4 0 0 1 -4,4h-78.88128996737356z" fill="#b5b4ae"/>
<text x="334.88128996737356" y="254" font-size="15" fill="#0b0b0b" font-weight="500">102<tspan font-weight="400" fill="#76756f" font-size="13" dx="8">reference</tspan></text>
<text x="32" y="338" font-size="12" fill="#76756f">20 pairs of the Koenigstuhl '94 hill × 600 rounds, 941M instructions. Whole process wall time, median of 7, one thread.</text>
<text x="32" y="356" font-size="12" fill="#76756f">pMARS -O2, exMARS -O3 -fomit-frame-pointer, rmars --release, 42mars -O3.</text>
<text x="32" y="374" font-size="12" fill="#76756f">Ryzen 9 7950X, GCC 16.2, Node 22.22, 14th November 2026. Commands: docs/images/speed.mjs.</text>
