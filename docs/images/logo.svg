<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 12 12" width="240" height="240" role="img" aria-label="42mars">
  <title>42mars</title>
  <!-- Mars as an 11 x 11 disc of core cells with 42 written into it. One unit is one cell.
       Square cells in 4 colours, with a checkerboard row between two colours, as on an 8-bit
       machine. The dark board under the cells makes it look the same on a bright and on a
       dark page: with the page showing through the gaps, bright digits were hard to read on
       white. -->
  <defs><rect id="c" width="0.88" height="0.88"/></defs>
  <g transform="translate(0.56 0.56)">
    <path fill="#3a0c1e" d="M3.88 -0.12h3.12v1.12h-3.12zM1.88 0.88h7.12v1.12h-7.12zM0.88 1.88h9.12v1.12h-9.12zM0.88 2.88h9.12v1.12h-9.12zM-0.12 3.88h11.12v1.12h-11.12zM-0.12 4.88h11.12v1.12h-11.12zM-0.12 5.88h11.12v1.12h-11.12zM0.88 6.88h9.12v1.12h-9.12zM0.88 7.88h9.12v1.12h-9.12zM1.88 8.88h7.12v1.12h-7.12zM3.88 9.88h3.12v1.12h-3.12z"/>
    <g fill="#ffa53a">
      <use xlink:href="#c" x="4" y="0"/><use xlink:href="#c" x="5" y="0"/><use xlink:href="#c" x="6" y="0"/>
      <use xlink:href="#c" x="2" y="1"/><use xlink:href="#c" x="3" y="1"/><use xlink:href="#c" x="4" y="1"/><use xlink:href="#c" x="5" y="1"/><use xlink:href="#c" x="6" y="1"/><use xlink:href="#c" x="7" y="1"/><use xlink:href="#c" x="8" y="1"/>
      <use xlink:href="#c" x="2" y="2"/><use xlink:href="#c" x="4" y="2"/><use xlink:href="#c" x="6" y="2"/><use xlink:href="#c" x="8" y="2"/>
    </g>
    <g fill="#f0652d">
      <use xlink:href="#c" x="1" y="2"/><use xlink:href="#c" x="3" y="2"/><use xlink:href="#c" x="5" y="2"/><use xlink:href="#c" x="7" y="2"/><use xlink:href="#c" x="9" y="2"/>
      <use xlink:href="#c" x="1" y="3"/><use xlink:href="#c" x="3" y="3"/><use xlink:href="#c" x="5" y="3"/><use xlink:href="#c" x="9" y="3"/>
      <use xlink:href="#c" x="0" y="4"/><use xlink:href="#c" x="1" y="4"/><use xlink:href="#c" x="3" y="4"/><use xlink:href="#c" x="5" y="4"/><use xlink:href="#c" x="6" y="4"/><use xlink:href="#c" x="7" y="4"/><use xlink:href="#c" x="9" y="4"/><use xlink:href="#c" x="10" y="4"/>
      <use xlink:href="#c" x="1" y="5"/><use xlink:href="#c" x="5" y="5"/><use xlink:href="#c" x="9" y="5"/>
    </g>
    <g fill="#c8352e">
      <use xlink:href="#c" x="0" y="5"/><use xlink:href="#c" x="10" y="5"/>
      <use xlink:href="#c" x="0" y="6"/><use xlink:href="#c" x="1" y="6"/><use xlink:href="#c" x="2" y="6"/><use xlink:href="#c" x="3" y="6"/><use xlink:href="#c" x="5" y="6"/><use xlink:href="#c" x="7" y="6"/><use xlink:href="#c" x="8" y="6"/><use xlink:href="#c" x="9" y="6"/><use xlink:href="#c" x="10" y="6"/>
      <use xlink:href="#c" x="1" y="7"/><use xlink:href="#c" x="2" y="7"/><use xlink:href="#c" x="3" y="7"/><use xlink:href="#c" x="5" y="7"/><use xlink:href="#c" x="9" y="7"/>
      <use xlink:href="#c" x="2" y="8"/><use xlink:href="#c" x="4" y="8"/><use xlink:href="#c" x="6" y="8"/><use xlink:href="#c" x="8" y="8"/>
    </g>
    <g fill="#8a1f38">
      <use xlink:href="#c" x="1" y="8"/><use xlink:href="#c" x="3" y="8"/><use xlink:href="#c" x="5" y="8"/><use xlink:href="#c" x="7" y="8"/><use xlink:href="#c" x="9" y="8"/>
      <use xlink:href="#c" x="2" y="9"/><use xlink:href="#c" x="3" y="9"/><use xlink:href="#c" x="4" y="9"/><use xlink:href="#c" x="5" y="9"/><use xlink:href="#c" x="6" y="9"/><use xlink:href="#c" x="7" y="9"/><use xlink:href="#c" x="8" y="9"/>
      <use xlink:href="#c" x="4" y="10"/><use xlink:href="#c" x="5" y="10"/><use xlink:href="#c" x="6" y="10"/>
    </g>
    <!-- joins the cells of each digit, from cell centre to cell centre. It is under the cells,
         so it only shows in the seams between them. -->
    <path transform="translate(0.44 0.44)" fill="none" stroke="#c98a6a" stroke-width="0.88" d="M2 3v2M2 5h2M4 3v4M6 3h2M8 3v2M8 5h-2M6 5v2M6 7h2"/>
    <g fill="#fff3dc">
      <use xlink:href="#c" x="2" y="3"/><use xlink:href="#c" x="4" y="3"/><use xlink:href="#c" x="6" y="3"/><use xlink:href="#c" x="7" y="3"/><use xlink:href="#c" x="8" y="3"/>
      <use xlink:href="#c" x="2" y="4"/><use xlink:href="#c" x="4" y="4"/><use xlink:href="#c" x="8" y="4"/>
      <use xlink:href="#c" x="2" y="5"/><use xlink:href="#c" x="3" y="5"/><use xlink:href="#c" x="4" y="5"/><use xlink:href="#c" x="6" y="5"/><use xlink:href="#c" x="7" y="5"/><use xlink:href="#c" x="8" y="5"/>
      <use xlink:href="#c" x="4" y="6"/><use xlink:href="#c" x="6" y="6"/>
      <use xlink:href="#c" x="4" y="7"/><use xlink:href="#c" x="6" y="7"/><use xlink:href="#c" x="7" y="7"/><use xlink:href="#c" x="8" y="7"/>
    </g>
  </g>
</svg>
