<text x="522.89688843" y="214" font-size="15" fill="#f0efec" font-weight="500">279<tspan font-weight="400" fill="#97968e" font-size="13" dx="8">2.6× pMARS</tspan></text>
<text x="228" y="254" text-anchor="end" font-size="15" fill="#f0efec" font-weight="500">rmars<tspan font-weight="400" fill="#97968e" font-size="13" dx="7">Rust</tspan></text>
