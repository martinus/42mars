<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">42mars: speed of Core War simulators, native code, one thread</title>
<desc id="desc">Million simulated instructions per second, one thread, the same 12,000 rounds for every engine: 42mars C 478, fmars C 402, exMARS 0.01 C 279, rmars Rust 192, pMARS 0.9.5 C 106.</desc>
<rect x="0.5" y="0.5" width="879" height="429" rx="14" fill="#1a1a19" stroke="#2e2e2c"/>
<text x="32" y="62" font-size="34" font-weight="700" fill="#f0efec">42mars<tspan font-weight="400" fill="#c3c2b7" font-size="21" dx="14">speed of Core War simulators, native code, one thread</tspan></text>
<text x="32" y="90" font-size="14.5" fill="#c3c2b7">Every engine plays the same 12,000 rounds and gets the same wins, losses and ties.</text>
<line x1="242" y1="110" x2="242" y2="308" stroke="#3a3a37" stroke-dasharray=""/>
<text x="242" y="326" text-anchor="middle" font-size="12" fill="#97968e">0</text>
