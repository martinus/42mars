<text x="228" y="294" text-anchor="end" font-size="15" fill="#f0efec" font-weight="500">pMARS 0.9.5<tspan font-weight="400" fill="#97968e" font-size="13" dx="7">C</tspan></text>
<path d="M242,278h98.58817076639053a4,4 0 0 1 4,4v14a4,4 0 0 1 -4,4h-98.58817076639053z" fill="#5c5b57"/>
<text x="354.58817076639053" y="294" font-size="15" fill="#f0efec" font-weight="500">106<tspan font-weight="400" fill="#97968e" font-size="13" dx="8">reference</tspan></text>
<text x="32" y="378" font-size="12" fill="#97968e">3 hill pairs × 4,000 rounds, 446M instructions. Whole process wall time, median of 7. Ryzen 9 7950X, GCC 16.2, Node 22.22, 12th November 2026.</text>
<text x="32" y="396" font-size="12" fill="#97968e">pMARS -O2, exMARS -O3 -fomit-frame-pointer, fmars -O3 -march=native, rmars --release, 42mars -O3. Commands: docs/images/speed.mjs.</text>
