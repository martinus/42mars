<text x="339.2" y="326" text-anchor="middle" font-size="12" fill="#97968e">100</text>
<line x1="436.4" y1="110" x2="436.4" y2="308" stroke="#3a3a37" stroke-dasharray="2 3"/>
<text x="436.4" y="326" text-anchor="middle" font-size="12" fill="#97968e">200</text>
<line x1="533.5999999999999" y1="110" x2="533.5999999999999" y2="308" stroke="#3a3a37" stroke-dasharray="2 3"/>
<text x="533.5999999999999" y="326" text-anchor="middle" font-size="12" fill="#97968e">300</text>
<line x1="630.8" y1="110" x2="630.8" y2="308" stroke="#3a3a37" stroke-dasharray="2 3"/>
<text x="630.8" y="326" text-anchor="middle" font-size="12" fill="#97968e">400</text>
<line x1="728" y1="110" x2="728" y2="308" stroke="#3a3a37" stroke-dasharray="2 3"/>
<text x="728" y="326" text-anchor="middle" font-size="12" fill="#97968e">500</text>
<text x="485" y="346" text-anchor="middle" font-size="13" fill="#c3c2b7">million simulated instructions per second</text>
<text x="228" y="134" text-anchor="end" font-size="15" fill="#f0efec" font-weight="700">42mars<tspan font-weight="400" fill="#97968e" font-size="13" dx="7">C</tspan></text>
<path d="M242,118h461.05903593133047a4,4 0 0 1 4,4v14a4,4 0 0 1 -4,4h-461.05903593133047z" fill="#f0652d"/>
