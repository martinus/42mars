name: lib-object
description: >-
  build/42mars.o from an earlier run with the same lib/, Makefile, workflow,
  compiler flags and runner image (#161), touched so that make takes it as
  built. lib/42mars.c is one translation unit and the longest compile of a
  job (57 s under ASan, 11 s at -O3, 18th November 2026); most pull requests
  do not change lib/. A tag always compiles.
inputs:
  flags:
    description: a short name for the compiler flags the job builds the library with
    required: true
runs:
  using: composite
  steps:
    - id: image
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      shell: bash
      # without ImageVersion the key is unique to the run, so nothing is reused
      run: echo "version=${ImageVersion:-run-$GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
    - id: cache
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/cache@v6
      with:
        path: build/42mars.o
        key: lib-object-${{ inputs.flags }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ hashFiles('lib/**', 'Makefile', '.github/workflows/test.yml') }}
    - if: ${{ steps.cache.outputs.cache-hit == 'true' }}
      shell: bash
      run: touch build/42mars.o
