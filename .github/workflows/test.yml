name: test

# Every push to main and every pull request: the test suite, the C library
# on Linux, macOS and Windows with its release archives, and an npm publish
# dry run. A tag v<version> (the version of package.json and lib/42mars.h)
# also makes a GitHub release with the archives and publishes the npm
# package; the publish stays a dry run until the repository variable
# NPM_PUBLISH is "true" (it needs the secret NPM_TOKEN).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: C11 without compiler extensions (the code MSVC builds)
        if: runner.os == 'Linux'
        run: |
          make -j4 CFLAGS='-O2 -std=c11 -pedantic -Wall -Wextra -Werror -DM42_PORTABLE' test
          make clean
      - name: make test
        if: runner.os != 'Windows'
        run: make -j4 CFLAGS='-O3 -Wall -Wextra -Werror' test
      - name: make dist
        if: runner.os != 'Windows'
        run: make dist
      - name: build-msvc.bat and the tests
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call build-msvc.bat || exit /b 1
          set M42_BIN=build
          node --test test/c-api.test.js test/cli.test.js
      - name: archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          $d = "build/42mars-$v-windows-x64"
          New-Item -ItemType Directory -Force "$d/bin", "$d/include", "$d/lib" | Out-Null
          Copy-Item build/42mars.exe, build/42mars.dll "$d/bin/"
          Copy-Item lib/42mars.h "$d/include/"
          Copy-Item build/42mars.lib, build/42mars-static.lib "$d/lib/"
          Copy-Item LICENSE "$d/"
          Compress-Archive -Path $d -DestinationPath "$d.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.os }}
          path: |
            build/42mars-*.tar.gz
            build/42mars-*.zip
          if-no-files-found: error

  npm:
    needs: [test, native]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: the tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - name: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') && vars.NPM_PUBLISH == 'true' }}" = true ]; then
            npm publish --provenance --access public
          else
            npm publish --dry-run
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
