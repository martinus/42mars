name: test

# Every push to main and every pull request: the test suite on the Node
# versions from package.json's minimum to the newest LTS, a check that
# wasm/build.sh gives the committed 42mars.wasm, the C library on Linux (x64
# and arm64), macOS and Windows with its release archives, the C library
# under AddressSanitizer and UndefinedBehaviorSanitizer, the comparison
# with pMARS 0.9.5. The fuzz targets (make
# fuzz) are not run here: 3.5 minutes per run for a smoke test; they run by
# hand and in the release gate. A tag v<version> (the version of
# package.json and lib/42mars.h) also makes a GitHub release with the
# archives. The JavaScript interface in wasm/ is a demo and not published
# on npm.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the run of the previous one. Other
# runs get a group of their own: every commit on main keeps its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  # The tests load the committed 42mars.wasm: this fails when it is not the
  # build of lib/ (also when lib/src/gen-dispatch.mjs changes dispatch.h).
  # Ubuntu's clang 22.1.2 and clang 22.1.8 gave the same bytes; another
  # clang version may not.
  wasm:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: sudo apt-get install -y --no-install-recommends clang-22 lld-22
      - run: CC=clang-22 sh wasm/build.sh
      - name: the committed files are the build
        run: |
          git diff --exit-code --stat -- wasm/42mars.wasm lib/src/dispatch.h || {
            echo "::error::wasm/42mars.wasm or lib/src/dispatch.h is not what wasm/build.sh builds from lib/ (clang-22): run wasm/build.sh and commit both"
            exit 1
          }

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: make -j4 CC=clang CFLAGS='-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all -Wall -Wextra -Werror' LDFLAGS='-fsanitize=address,undefined' test

  # 42mars against pMARS 0.9.5 (#91), built from its source archive and run
  # as a program only. The clean room (CLAUDE.md): nobody reads the files of
  # that archive, the build's output goes to /dev/null so that no compiler
  # message quotes a source line into the log, and nothing of it is uploaded.
  # Repository variables; the job is skipped until all are set:
  #   PMARS_SOURCE_URL     the source archive of pMARS 0.9.5 (.tar.gz, .tgz or .zip)
  #   PMARS_SOURCE_SHA256  its SHA-256
  #   PMARS_BUILD          a shell command, run in the unpacked archive, that
  #                        builds the server version (-DSERVER -DEXT94
  #                        -DPERMUTATE -DRWLIMIT) and leaves the binary at $PMARS_OUT
  # The corpus is in the repository: warriors/koenigstuhl/94nop (1107 hill
  # warriors), its first 20 files for the tournament, and
  # warriors/koenigstuhl/88 for the ICWS'88 listings. The binary is cached by
  # the archive's hash and the build command. CI
  # compares scores, listings and outputs: the per-round instruction counts
  # and core hashes (--pmars-trace) and pMARS's evaluator (tools/expr-fuzz.mjs)
  # need patched builds and stay local checks. The seed is the run id.
  pmars:
    if: vars.PMARS_SOURCE_URL != '' && vars.PMARS_SOURCE_SHA256 != '' && vars.PMARS_BUILD != ''
    runs-on: ubuntu-latest
    env:
      PMARS_OUT: ${{ github.workspace }}/../ref-bin/pmars
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: hash
        env:
          PMARS_BUILD: ${{ vars.PMARS_BUILD }}
        run: echo "build=$(printf '%s' "$PMARS_BUILD" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/../ref-bin
          key: pmars-${{ vars.PMARS_SOURCE_SHA256 }}-${{ steps.hash.outputs.build }}
      - name: build pMARS from its archive (output hidden)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          URL: ${{ vars.PMARS_SOURCE_URL }}
          SHA: ${{ vars.PMARS_SOURCE_SHA256 }}
          PMARS_BUILD: ${{ vars.PMARS_BUILD }}
        run: |
          src="$RUNNER_TEMP/ref-src"
          mkdir -p "$src" "$(dirname "$PMARS_OUT")"
          curl -fsSL "$URL" -o "$RUNNER_TEMP/ref-archive"
          # The hash only, never the content: it gives the value for a new
          # archive and tells a changed archive from a broken build.
          got="$(sha256sum "$RUNNER_TEMP/ref-archive" | cut -d' ' -f1)"
          if [ "$got" != "$SHA" ]; then
            echo "::error::the archive's SHA-256 is $got, PMARS_SOURCE_SHA256 is $SHA"
            exit 1
          fi
          case "$URL" in
            *.zip) unzip -q "$RUNNER_TEMP/ref-archive" -d "$src" ;;
            *) tar -xf "$RUNNER_TEMP/ref-archive" -C "$src" ;;
          esac
          if (cd "$src" && sh -c "$PMARS_BUILD") > /dev/null 2>&1 && [ -x "$PMARS_OUT" ]; then
            echo "pMARS built"
          else
            echo "::error::the build of pMARS failed; its output is hidden on purpose (clean room): build it locally to see why"
            exit 1
          fi
          rm -rf "$src" "$RUNNER_TEMP/ref-archive"
      - name: the tournament set, the first 20 warriors of the corpus
        run: |
          mkdir -p "$RUNNER_TEMP/t20"
          ls warriors/koenigstuhl/94nop | LC_ALL=C sort | head -20 | while read -r f; do cp "warriors/koenigstuhl/94nop/$f" "$RUNNER_TEMP/t20/"; done
      - run: make
      - name: compare with pMARS
        run: |
          set -e
          echo "seed ${{ github.run_id }}"
          d="node tools/pmars-diff.mjs --pmars $PMARS_OUT --seed ${{ github.run_id }} --jobs 4"
          $d --corpus warriors/koenigstuhl/94nop
          $d --corpus warriors/koenigstuhl/94nop --wasm-match --only battles
          $d --corpus warriors/koenigstuhl/94nop --permute --only battles,fuzz
          $d --corpus warriors/koenigstuhl/88 --icws88 --only listings,exprs,sources
          $d --corpus warriors/koenigstuhl/94nop --cli build/42mars --only cli
          node tools/tournament.mjs "$RUNNER_TEMP/t20" --rounds 100 --seed ${{ github.run_id }} --pmars "$PMARS_OUT" --compare
          node tools/example-check.mjs "$RUNNER_TEMP/t20" --pmars "$PMARS_OUT" --seed ${{ github.run_id }}

  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: C11 without compiler extensions (the code MSVC builds)
        if: runner.os == 'Linux'
        run: |
          make -j4 CFLAGS='-O2 -std=c11 -pedantic -Wall -Wextra -Werror -DM42_PORTABLE' test
          make clean
      - name: make test
        if: runner.os != 'Windows'
        run: make -j4 CFLAGS='-O3 -Wall -Wextra -Werror' test
      - name: make dist
        if: runner.os != 'Windows'
        run: make dist
      # The archive as a user gets it (#94): unpacked elsewhere, its 42mars
      # plays two warriors, and examples/example.c builds against it through
      # pkg-config and runs on its shared library.
      - name: the archive works when unpacked
        if: runner.os != 'Windows'
        run: |
          a="$RUNNER_TEMP/archive"
          mkdir -p "$a"
          tar -xzf build/42mars-*.tar.gz -C "$a"
          d="$(echo "$a"/42mars-*)"
          test "$("$d/bin/42mars" -b -r 10 -F 4000 warriors/dwarf.red warriors/imp.red | tail -1)" = "Results: 2 0 8"
          export PKG_CONFIG_PATH="$d/lib/pkgconfig"
          cc -O2 -o "$a/example" examples/example.c $(pkg-config --define-prefix --cflags --libs 42mars)
          LD_LIBRARY_PATH="$d/lib" DYLD_LIBRARY_PATH="$d/lib" "$a/example" -r 10 -F 4000 warriors/dwarf.red warriors/imp.red > "$a/out"
          printf '2 0 8\n0 2 8\n' | diff - "$a/out"
      # The object of lib/42mars.c (about 40 s of cl /O2) from an earlier run
      # with the same lib/, build-msvc.bat and runner image, whose MSVC made
      # it. build-msvc.bat compiles only without it. Runs on main save it and
      # pull requests read it; a tag always compiles. Without ImageVersion
      # the key is unique to the run, so nothing is reused.
      - name: runner image (Windows)
        id: image
        if: runner.os == 'Windows' && !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = if ($env:ImageVersion) { $env:ImageVersion } else { "run-$env:GITHUB_RUN_ID" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: cached library object (Windows)
        id: obj
        if: runner.os == 'Windows' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/cache@v6
        with:
          path: build/42mars.obj
          key: msvc-obj-${{ steps.image.outputs.version }}-${{ hashFiles('lib/**', 'build-msvc.bat') }}
      # Under a minute. The limit catches cl /O2 slowing down again: with all
      # 32 cases of dispatch.h (M42_DISPATCH_16 in platform.h) the library
      # alone took 2 minutes or more.
      - name: build-msvc.bat and the tests
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: cmd
        env:
          M42_OBJ_CACHED: ${{ steps.obj.outputs.cache-hit }}
        run: |
          call build-msvc.bat || exit /b 1
          set M42_BIN=build
          node --test test/c-api.test.js test/cli.test.js
      - name: archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          $d = "build/42mars-$v-windows-x64"
          New-Item -ItemType Directory -Force "$d/bin", "$d/include", "$d/lib" | Out-Null
          Copy-Item build/42mars.exe, build/42mars.dll "$d/bin/"
          Copy-Item lib/42mars.h "$d/include/"
          Copy-Item build/42mars.lib, build/42mars-static.lib "$d/lib/"
          Copy-Item LICENSE "$d/"
          Compress-Archive -Path $d -DestinationPath "$d.zip"
      - name: the archive works when unpacked (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`node -p "require('./package.json').version"`) do set "V=%%i"
          set "A=%RUNNER_TEMP%\archive"
          mkdir "%A%"
          tar -xf build\42mars-%V%-windows-x64.zip -C "%A%" || exit /b 1
          set "D=%A%\42mars-%V%-windows-x64"
          "%D%\bin\42mars.exe" -b -r 10 -F 4000 warriors\dwarf.red warriors\imp.red > "%A%\out1" || exit /b 1
          findstr /x /c:"Results: 2 0 8" "%A%\out1" || exit /b 1
          where cl >nul 2>nul || for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat" >nul
          cl /nologo /O2 /I "%D%\include" examples\example.c "%D%\lib\42mars.lib" /Fo"%A%\example.obj" /Fe"%A%\example.exe" || exit /b 1
          set "PATH=%D%\bin;%PATH%"
          "%A%\example.exe" -r 10 -F 4000 warriors\dwarf.red warriors\imp.red > "%A%\out2" || exit /b 1
          findstr /x /c:"2 0 8" "%A%\out2" || exit /b 1
          findstr /x /c:"0 2 8" "%A%\out2" || exit /b 1
      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.os }}
          path: |
            build/42mars-*.tar.gz
            build/42mars-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, wasm, sanitizers, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
